<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZAMA Poppy Hop</title>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    .instructions {
        position: absolute;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        text-align: center;
        color: #333;
        font-size: 16px;
        z-index: 10;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 100%);
        overflow: hidden;
        touch-action: manipulation;
        user-select: none;
    }

    #gameContainer {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
    }

    #gameCanvas {
        display: block;
        background: linear-gradient(to bottom, #87CEEB 0%, #98FB98 70%, #90EE90 100%);
    }

    .ui {
        position: absolute;
        top: 20px;
        left: 20px;
        color: #333;
        font-size: 20px;
        font-weight: bold;
        z-index: 10;
    }

    .title {
        position: absolute;
        top: 20px;
        right: 20px;
        text-align: right;
        color: #333;
        z-index: 10;
    }

    .title h1 {
        font-size: 24px;
        margin: 0;
        font-weight: bold;
    }

    .title p {
        font-size: 12px;
        margin: 5px 0 0 0;
        color: #666;
    }

    .game-over {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        text-align: center;
        color: #333;
        z-index: 10;
        display: none;
    }

    .game-over h2 {
        font-size: 24px;
        margin-bottom: 20px;
    }

    .game-over p {
        font-size: 18px;
        margin-bottom: 20px;
    }

    .donate-link {
        display: inline-block;
        padding: 10px 20px;
        background: #4CAF50;
        color: white;
        text-decoration: none;
        border-radius: 5px;
        margin-bottom: 20px;
        font-size: 16px;
        transition: background 0.3s;
    }

    .donate-link:hover {
        background: #45a049;
    }

    .restart-btn {
        padding: 15px 30px;
        font-size: 20px;
        background: #FF6B35;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        transition: background 0.3s;
    }

    .restart-btn:hover {
        background: #E55A2B;
    }

    .solidarity-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(45deg, #FF6B6B, #4ECDC4, #45B7D1, #96CEB4);
        background-size: 400% 400%;
        animation: gradientShift 3s ease infinite;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        color: white;
        font-size: 18px;
        font-weight: bold;
        z-index: 20;
        padding: 40px;
    }

    @keyframes gradientShift {
        0% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
        100% { background-position: 0% 50%; }
    }
</style>

</head>
<body>

<div id="gameContainer">
    <canvas id="gameCanvas"></canvas>

    <div class="solidarity-screen" id="solidarityScreen">
        <div>
            <p>In solidarity with the Palestinian people</p>
            <p>- Love, Zahrat AlHanun Mutual Aid Team</p>
        </div>
    </div>

    <div class="ui">
        <div>Score: <span id="score">0</span></div>
        <div>High Score: <span id="highScore">0</span></div>
    </div>

    <div class="title">
        <h1>ZAMA Poppy Hop</h1>
        <p>Donate to MutualAidGaza.Org</p>
    </div>

    <div class="game-over" id="gameOver">
        <h2>Game Over!</h2>
        <p>Final Score: <span id="finalScore">0</span></p>
        <a href="https://MutualAidGaza.Org" target="_blank" class="donate-link">Donate to MutualAidGaza.Org</a><br>
        <button class="restart-btn" onclick="restartGame()">Play Again</button>
    </div>

    <div class="instructions" id="instructions">
        <p>Tap to make the butterfly jump over poppies!</p>
    </div>
</div>

<script>

// ---------------------
//  CANVAS SETUP
// ---------------------

const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener("resize", resizeCanvas);

// ---------------------
//  LOAD ANIMATION FRAMES
// ---------------------

const butterflyFrames = [];
for (let i = 1; i <= 5; i++) {
    const img = new Image();
    img.src = `assets/blue_${i}.png`;
    butterflyFrames.push(img);
}

let currentFrame = 0;
let frameTimer = 0;
const frameSpeed = 8; // lower = faster animation

// ---------------------
//  GAME VARIABLES
// ---------------------

let gameRunning = false;
let gameStarted = false;
let score = 0;

let highScore = parseInt(localStorage.getItem("butterflyHighScore") || "0");
document.getElementById("highScore").textContent = highScore;

const gravity = 0.6;
const jumpPower = -12;
const gameSpeed = 3;

const butterfly = {
    x: 80,
    y: window.innerHeight - 200,
    width: 90,
    height: 80,
    velY: 0,
    grounded: true
};

let obstacles = [];
let obstacleTimer = 0;
let groundY = canvas.height - 80;

// ---------------------
//  DRAWING FUNCTIONS
// ---------------------

function drawButterfly() {
    frameTimer++;
    if (frameTimer >= frameSpeed) {
        frameTimer = 0;
        currentFrame = (currentFrame + 1) % butterflyFrames.length;
    }
    ctx.drawImage(
        butterflyFrames[currentFrame],
        butterfly.x,
        butterfly.y,
        butterfly.width,
        butterfly.height
    );
}

function drawPoppy(x, y) {
    ctx.fillStyle = "red";
    ctx.beginPath();
    ctx.arc(x + 15, y + 15, 15, 0, Math.PI * 2);
    ctx.fill();
}

function drawGround() {
    ctx.fillStyle = "#9CAF88";
    ctx.fillRect(0, groundY, canvas.width, canvas.height - groundY);
}

// ---------------------
//  UPDATE FUNCTIONS
// ---------------------

function updateButterfly() {
    if (!butterfly.grounded) {
        butterfly.velY += gravity;
    }

    butterfly.y += butterfly.velY;

    if (butterfly.y >= groundY - butterfly.height) {
        butterfly.y = groundY - butterfly.height;
        butterfly.velY = 0;
        butterfly.grounded = true;
    }
}

function jump() {
    if (butterfly.grounded && gameRunning) {
        butterfly.velY = jumpPower;
        butterfly.grounded = false;
    }
}

function createObstacle() {
    obstacles.push({
        x: canvas.width,
        y: groundY - 30,
        width: 30,
        height: 30
    });
}

function updateObstacles() {
    for (let i = obstacles.length - 1; i >= 0; i--) {
        obstacles[i].x -= gameSpeed;

        if (obstacles[i].x + obstacles[i].width < 0) {
            obstacles.splice(i, 1);
            score += 10;
            document.getElementById("score").textContent = score;
        }
    }

    obstacleTimer++;
    if (obstacleTimer > 120 + Math.random() * 60) {
        createObstacle();
        obstacleTimer = 0;
    }
}

function checkCollisions() {
    for (let o of obstacles) {
        if (
            butterfly.x < o.x + o.width &&
            butterfly.x + butterfly.width > o.x &&
            butterfly.y < o.y + o.height &&
            butterfly.y + butterfly.height > o.y
        ) {
            gameOver();
        }
    }
}

function gameOver() {
    gameRunning = false;

    document.getElementById("finalScore").textContent = score;
    document.getElementById("gameOver").style.display = "block";
    document.getElementById("instructions").style.display = "none";

    if (score > highScore) {
        highScore = score;
        localStorage.setItem("butterflyHighScore", highScore);
        document.getElementById("highScore").textContent = highScore;
    }
}

function restartGame() {
    gameRunning = true;
    gameStarted = true;
    score = 0;

    document.getElementById("score").textContent = score;
    document.getElementById("gameOver").style.display = "none";
    document.getElementById("instructions").style.display = "block";

    butterfly.y = groundY - butterfly.height;
    butterfly.velY = 0;
    butterfly.grounded = true;

    obstacles = [];
    obstacleTimer = 0;
}

// ---------------------
//  GAME LOOP
// ---------------------

function gameLoop() {
    ctx.fillStyle = "#B8C5A6";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    groundY = canvas.height - 80;

    drawGround();

    if (gameRunning) {
        updateButterfly();
        updateObstacles();
        checkCollisions();
    }

    drawButterfly();

    for (let obs of obstacles) {
        drawPoppy(obs.x, obs.y);
    }

    requestAnimationFrame(gameLoop);
}

// ---------------------
//  INPUT HANDLERS
// ---------------------

canvas.addEventListener("click", () => {
    if (!gameStarted && !gameRunning && obstacles.length === 0) {
        restartGame();
    } else {
        jump();
    }
});

canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (!gameStarted && !gameRunning && obstacles.length === 0) {
        restartGame();
    } else {
        jump();
    }
});

// Hide intro screen
setTimeout(() => {
    document.getElementById("solidarityScreen").style.display = "none";
}, 1500);

// Prevent mobile scroll
document.addEventListener("touchmove", (e) => e.preventDefault(), { passive: false });

gameLoop();

</script>

</body>
</html>
